name: CI Test Suite & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Backend Test Pipeline
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Seed Database
        working-directory: ./backend
        run: npm run seed

      - name: Start Backend Server in Background
        working-directory: ./backend
        run: |
          npm start &
          sleep 3
        env:
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: test_github_actions_ci_secret_key_entropy_verification_2026

      - name: Run 153-Item Programmatic Test Suite
        working-directory: ./backend
        run: npm test
        env:
          PORT: 5000
          JWT_SECRET: test_github_actions_ci_secret_key_entropy_verification_2026

      # Frontend Build Pipeline
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Production Assets
        working-directory: ./frontend
        run: npm run build
